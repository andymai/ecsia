# Weekly dependency updates. Dev-dep minors/patches arrive grouped as one PR; majors
# get individual PRs so each carries its own evaluation. Runtime deps are few and
# workspace-internal — anything external that appears later gets a PR per update.
#
# `cooldown` holds proposals back until a release has aged, so a fresh malicious
# upload (the npm supply-chain attack pattern) isn't suggested the moment it lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # engines pin node >=22.13 — types track the minimum supported runtime, not latest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typedoc 0.28.20 is its latest release and peers typescript up to 6.0.x.
      # On 7.x (the native rewrite) it dies reading ts.SyntaxKind.PropertyDeclaration
      # and takes `pnpm docs:api` with it. Lift once typedoc supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Note: Dependabot supports only `default-days` for the github-actions ecosystem —
    # `semver-major-days` is npm-only and fails config validation here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
