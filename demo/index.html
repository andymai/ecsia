<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ECHO SURVIVORS — an ecsia demo</title>
    <meta name="description" content="A time-loop survivors game where every death spawns a ghost of your past run — powered by ecsia's deterministic, multithreaded ECS. Byte-identical replays in a URL." />
    <style>
      :root {
        --phos: #7dffb3;
        --cyan: #6ae7ff;
        --amber: #ffc46a;
        --red: #ff5c7a;
        --dim: #3a5a4a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(ellipse at 50% 40%, #0b1210 0%, #050807 65%, #020303 100%);
        color: var(--phos);
        font-family: 'Courier New', ui-monospace, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Mobile browsers: dvh tracks the collapsing URL bar; kill pull-to-refresh/overscroll. */
        height: 100dvh;
        overscroll-behavior: none;
      }
      #frame {
        position: relative;
        width: min(96vw, calc(96vh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 18px;
        box-shadow:
          0 0 0 6px #1a1f1c,
          0 0 0 8px #0c0f0d,
          0 0 60px rgba(60, 255, 160, 0.07),
          inset 0 0 80px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      /* Fullscreen keeps the 16:9 arena letterboxed — never stretched. */
      #frame:fullscreen {
        width: 100%;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #frame:fullscreen canvas#screen {
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
      }
      canvas#screen {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        /* The canvas is the touch joystick surface: no browser gestures, no long-press menu. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #stick {
        position: absolute;
        width: 76px;
        height: 76px;
        margin: -38px 0 0 -38px;
        border: 1px solid rgba(125, 255, 179, 0.35);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(125, 255, 179, 0.05) 0%, rgba(125, 255, 179, 0.1) 100%);
        pointer-events: none;
        display: none;
      }
      #stick-nub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border-radius: 50%;
        background: rgba(125, 255, 179, 0.4);
        box-shadow: 0 0 10px rgba(125, 255, 179, 0.5);
      }
      .hud {
        position: absolute;
        font-size: clamp(9px, 1.1vw, 13px);
        letter-spacing: 0.08em;
        text-shadow: 0 0 6px rgba(125, 255, 179, 0.55);
        pointer-events: none;
        white-space: pre;
        line-height: 1.5;
      }
      #hud-perf { top: 10px; left: 14px; }
      #hud-right { top: 10px; right: 14px; text-align: right; pointer-events: auto; }
      #hud-bottom { bottom: 10px; left: 14px; }
      #hud-score { bottom: 10px; right: 14px; text-align: right; }
      #spark { image-rendering: pixelated; opacity: 0.9; display: block; margin-top: 2px; }
      .badge { color: var(--cyan); }
      .warn { color: var(--amber); }
      .bad { color: var(--red); }
      button, .btn {
        pointer-events: auto;
        font: inherit;
        letter-spacing: inherit;
        color: var(--phos);
        background: rgba(10, 30, 20, 0.7);
        border: 1px solid var(--dim);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
        text-shadow: inherit;
      }
      button:hover { border-color: var(--phos); }
      button.on { color: #061410; background: var(--phos); text-shadow: none; }
      /* Touch ergonomics: finger-sized targets, no accidental text selection on chrome. */
      @media (pointer: coarse) {
        button, .btn { padding: 10px 16px; font-size: clamp(12px, 3.2vw, 16px); }
        .hud, #overlay { -webkit-user-select: none; user-select: none; }
        /* …but the in-game corner controls stay compact — big targets are for menu screens. */
        .hud button { padding: 3px 9px; font-size: 11px; }
      }
      /* Landscape phones: the frame fills the screen — drop the page footer, tighten the HUD so
         the two top corners never collide. */
      @media (max-height: 520px) {
        #footer { display: none; }
        .hud { font-size: 9px; }
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: clamp(6px, 1.6vh, 14px);
        text-align: center;
        background: radial-gradient(ellipse at center, rgba(2, 8, 5, 0.25) 0%, rgba(2, 8, 5, 0.78) 100%);
        transition: opacity 0.25s;
        overflow-y: auto;
        padding: 14px;
      }
      /* Overflow-safe vertical centering: auto margins collapse when content exceeds the frame,
         so short frames (portrait phones) scroll from the top instead of clipping the heading. */
      #overlay::before,
      #overlay::after { content: ''; margin: auto; flex-shrink: 0; }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      /* Portrait phones: the 16:9 frame is barely 220 CSS px tall — menus escape to the full
         screen (fixed positioning breaks out of the frame's overflow) while the arena stays put. */
      @media (orientation: portrait) {
        #overlay { position: fixed; background: rgba(2, 8, 5, 0.82); }
      }
      /* The corner HUD reads through the translucent overlay — on short frames it collides with
         overlay text, so hide it whenever an overlay screen is up. */
      #frame:has(#overlay:not(.hidden)) .hud { opacity: 0; pointer-events: none; }
      #overlay h1 {
        font-size: clamp(26px, 5vw, 64px);
        letter-spacing: 0.18em;
        color: var(--cyan);
        text-shadow: 0 0 18px rgba(106, 231, 255, 0.7), 0 0 3px #fff;
      }
      #overlay h2 { font-size: clamp(16px, 2.6vw, 30px); letter-spacing: 0.2em; }
      #overlay p { font-size: clamp(10px, 1.4vw, 15px); letter-spacing: 0.1em; max-width: 60ch; line-height: 1.7; }
      #overlay .keys { color: var(--amber); }
      #overlay a { color: var(--cyan); }

      /* ── Title screen: a hand-built CRT boot card, deliberately NOT a centered hero.
         Left-aligned, terminal-readout controls, a blinking-cursor prompt for the CTA. ── */
      .boot {
        pointer-events: auto;
        text-align: left;
        width: min(680px, 92vw);
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 1.8vh, 16px);
        border: 1px solid var(--dim);
        border-left: 3px solid var(--phos);
        border-radius: 6px;
        background: linear-gradient(180deg, rgba(9, 20, 15, 0.9), rgba(5, 12, 9, 0.86));
        box-shadow: inset 0 0 46px rgba(0, 0, 0, 0.55), 0 0 40px rgba(60, 255, 160, 0.06);
        padding: clamp(16px, 3vw, 30px);
      }
      .boot-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--dim);
        border-bottom: 1px dashed var(--dim);
        padding-bottom: 8px;
      }
      .boot-top b { color: var(--amber); font-weight: 400; }
      .boot-word {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .boot-word i {
        font-style: normal;
        font-size: clamp(13px, 1.7vw, 17px);
        letter-spacing: 0.5em;
        color: var(--cyan);
        opacity: 0.75;
      }
      .boot-word span {
        font-size: clamp(30px, 6.2vw, 62px);
        line-height: 0.9;
        letter-spacing: 0.02em;
        font-weight: 700;
        color: #eafff4;
        text-shadow: 0 0 2px #fff, 3px 3px 0 rgba(106, 231, 255, 0.28);
      }
      .boot-sub { color: #9fc7b4 !important; max-width: 52ch; }
      .boot-sub b { color: var(--amber); font-weight: 400; }
      .boot-spec {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 16px;
        font-size: clamp(10px, 1.3vw, 13px);
        letter-spacing: 0.08em;
        color: #c8e6d7;
      }
      .boot-spec dt { color: var(--dim); }
      .boot-settings { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
      .boot-settings .lbl { font-size: 10px; letter-spacing: 0.2em; color: var(--dim); }
      .boot-cta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 2px;
        flex-wrap: wrap;
      }
      #btn-start {
        pointer-events: auto;
        font: inherit;
        letter-spacing: 0.16em;
        color: #061410;
        background: var(--phos);
        border: none;
        border-radius: 3px;
        padding: 9px 18px;
        cursor: pointer;
        text-shadow: none;
      }
      #btn-start::before { content: '▸ '; }
      #btn-start:hover { box-shadow: 0 0 18px rgba(125, 255, 179, 0.5); }
      .boot-cta .cursor { color: var(--phos); animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .boot-foot { font-size: 10px !important; color: var(--dim) !important; letter-spacing: 0.08em; max-width: none !important; }
      #sharebox {
        pointer-events: auto;
        font-size: clamp(9px, 1.1vw, 12px);
        max-width: 72ch;
        word-break: break-all;
        background: rgba(8, 20, 14, 0.85);
        border: 1px solid var(--dim);
        border-radius: 4px;
        padding: 8px 10px;
        user-select: all;
      }
      .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
      #glitch {
        position: absolute; inset: 0; pointer-events: none; opacity: 0; background:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 3px);
        mix-blend-mode: screen;
      }
      #glitch.on { animation: glitch 0.9s steps(12) forwards; }
      @keyframes glitch {
        0% { opacity: 1; transform: translateX(0); filter: hue-rotate(0deg); }
        30% { transform: translateX(-6px) scaleY(1.02); }
        55% { transform: translateX(5px); filter: hue-rotate(120deg); }
        100% { opacity: 0; transform: none; filter: none; }
      }
      #footer {
        position: fixed; bottom: 6px; left: 0; right: 0; text-align: center;
        font-size: 11px; letter-spacing: 0.1em; color: #2f4a3d;
      }
      #footer a { color: #4a7a62; text-decoration: none; }
      #footer a:hover { color: var(--phos); }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="screen"></canvas>
      <div id="stick"><div id="stick-nub"></div></div>
      <div id="glitch"></div>
      <div id="hud-perf" class="hud"></div>
      <div id="hud-right" class="hud"></div>
      <div id="hud-bottom" class="hud"></div>
      <div id="hud-score" class="hud"></div>
      <div id="overlay"></div>
    </div>
    <div id="footer">
      powered by <a href="https://github.com/andymai/ecsia" target="_blank" rel="noopener">ecsia</a> —
      the multithreaded, deterministic ECS for TypeScript · every frame you see is running its real
      worker-pool scheduler
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
